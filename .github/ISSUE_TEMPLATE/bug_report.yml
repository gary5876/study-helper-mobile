name: 버그 리포트
description: 모바일 앱 동작 이상·오류·회귀를 보고
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        가능한 한 재현 가능한 형태로 작성해 주세요. 민감 정보(API 키·토큰)는 마스킹.
  - type: textarea
    id: summary
    attributes:
      label: 증상 요약
      description: 무엇이 어떻게 잘못되는지 1~3줄
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 재현 절차
      placeholder: |
        1. 앱 실행 → 로그인
        2. PDF 업로드
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      description: 에러 메시지·스크린샷·로그(`__DEV__`)
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 플랫폼
      multiple: true
      options:
        - iOS (시뮬레이터)
        - iOS (실기기)
        - Android (에뮬레이터)
        - Android (실기기)
        - Expo Go
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 환경
      description: OS 버전 / 기기 / Expo SDK / 앱 버전 / 커밋 SHA
      placeholder: "iOS 17.4 / iPhone 15 / Expo 51 / a923b21"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 추가 정보
